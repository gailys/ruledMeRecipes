<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f35" />
    <meta name="description" content="Išsisaugokite Ruled.me receptus, pakeiskite porcijas ir kurkite lietuvišką pirkinių sąrašą." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=12" />
    <title>Mano keto receptai</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#recipes" aria-label="Mano keto receptai">
        <span class="brand-mark">K</span>
        <span>Mano keto</span>
      </a>
      <nav aria-label="Pagrindinis meniu">
        <a href="#recipes" data-nav="recipes">Receptai</a>
        <a href="#shopping" data-nav="shopping">Pirkiniai <span id="cart-count" class="count">0</span></a>
        <a href="#add" data-nav="add">Pridėti</a>
      </nav>
    </header>

    <main>
      <section id="recipes-view" class="view">
        <div class="library-heading">
          <div><p class="eyebrow">Jūsų kolekcija</p><h1>Mano receptai</h1></div>
          <span id="recipe-count" class="muted"></span>
        </div>
        <div id="category-filters" class="filters" aria-label="Filtruoti receptus"></div>
        <div id="recipe-grid" class="recipe-grid"></div>
      </section>

      <section id="detail-view" class="view" hidden></section>

      <section id="shopping-view" class="view" hidden>
        <div class="shopping-head">
          <div><p class="eyebrow">Pirkinių krepšelis</p><h1>Ko reikės</h1></div>
          <button id="clear-cart" class="text-button">Išvalyti sąrašą</button>
        </div>
        <p class="shopping-note">Panašūs produktai sujungiami. Prieš apsipirkdami galite pataisyti pavadinimą ar kiekį.</p>
        <div id="shopping-list" class="shopping-list"></div>
      </section>

    </main>

    <aside id="install-banner" class="install-banner" hidden aria-label="Įdiegti programėlę">
      <span class="install-icon">K</span>
      <span class="install-copy"><strong>Įdiekite programėlę</strong><small>Greita prieiga ir receptai neprisijungus</small></span>
      <button id="install-app" class="primary">Įdiegti</button>
      <button id="dismiss-install" class="install-dismiss" aria-label="Uždaryti">×</button>
    </aside>

    <dialog id="add-dialog" class="add-dialog">
      <button type="button" class="dialog-close" aria-label="Uždaryti">×</button>
      <form id="import-form" class="import-form" method="dialog">
        <div class="input-row">
          <input id="recipe-url" name="url" type="url" inputmode="url" required aria-label="Ruled.me recepto nuoroda"
            placeholder="Įklijuokite nuorodą, pvz. https://www.ruled.me/receptas/" />
          <button type="submit" class="primary">Išsaugoti</button>
        </div>
        <p id="import-status" class="status" role="status"></p>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js?v=12"></script>
  </body>
</html>
